spring.application.name=SmartBankOnboarding


server.port=8787


spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp




# ==============================
# Email Functionality CONFIGURATION
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ==============================
# MULTIPART FILE CONFIGURATION
# ==============================

spring.servlet.multipart.enabled=true

# Maximum single file size
spring.servlet.multipart.max-file-size=200MB

# Maximum request size
spring.servlet.multipart.max-request-size=200MB

# File threshold
spring.servlet.multipart.file-size-threshold=1MB



# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartbankdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
   


# ===============================
# HIBERNATE / JPA CONFIG
# ===============================

# Dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Show SQL in console
spring.jpa.show-sql=true
# Update tables automatically
spring.jpa.hibernate.ddl-auto=update
# Format the SQL output
spring.jpa.properties.hibernate.format_sql=true

